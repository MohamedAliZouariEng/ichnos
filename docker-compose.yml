name: ichnos

services:
  api:
    build:
      context: apps/api
    env_file:
      - path: .env
        required: false
    environment:
      ICHNOS_ENV: production
      ICHNOS_DATA_DIR: /data
    volumes:
      - ichnos-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      # Local only by default. See docs/project/self-hosting.md before exposing it.
      - "127.0.0.1:${ICHNOS_WEB_PORT:-8765}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local models (ADR-0006): docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ichnos-data:
  ollama-models:
