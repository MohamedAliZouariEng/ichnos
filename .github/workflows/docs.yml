name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-okf:
    name: OKF validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements-docs.txt
      - name: Validate docs/ as an OKF v0.2 bundle
        run: python scripts/validate_okf.py docs --strict

  rename-check:
    name: Rename check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for the old project name
        run: bash scripts/check_rename.sh
