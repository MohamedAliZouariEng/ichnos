version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 has no compiler API yet; openapi-typescript needs it (Step 7).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    ignore:
      # Node follows the LTS line pinned in .nvmrc; upgrade deliberately (see PR #3).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # pyproject.toml pins Python 3.12; a new Python minor is a deliberate upgrade.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
